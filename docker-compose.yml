version: '3.8'

services:
  vqc:
    build: .
    container_name: vqc-iris-classifier
    volumes:
      - ./results:/app/results
      - ./notebooks:/app/notebooks
    working_dir: /app
    command: python vqc_iris.py
    environment:
      - PYTHONUNBUFFERED=1

  jupyter:
    build: .
    container_name: vqc-jupyter
    ports:
      - "8888:8888"
    volumes:
      - ./:/app
      - ./results:/app/results
    working_dir: /app
    command: jupyter notebook --ip=0.0.0.0 --allow-root --no-browser
    environment:
      - PYTHONUNBUFFERED=1
